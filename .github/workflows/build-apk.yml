name: 构建 APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: core-bili 单元测试
        run: gradle :core-bili:test --no-daemon --stacktrace

      - name: 打 Debug APK
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      # 失败时 Gradle 的栈会把编译错误刷出屏幕，这里单独把它们捞出来
      - name: 编译错误摘要
        if: failure()
        run: |
          echo "===== Kotlin 编译错误 ====="
          grep -E "^e: |^w: .*error" build.log | sed "s|file://$GITHUB_WORKSPACE/||" || echo "（没有匹配到 e: 开头的行）"
          echo "===== 其它失败线索 ====="
          grep -E "FAILED|What went wrong|Could not|Unresolved|error:" build.log | head -40 || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bibilili-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core-bili/build/reports/tests/test
          if-no-files-found: ignore
